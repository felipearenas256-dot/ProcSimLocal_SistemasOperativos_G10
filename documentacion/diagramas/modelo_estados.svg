<text x="40" y="66" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">Transiciones que anima la función F3</text>
<rect x="35" y="115" width="150" height="50" rx="25" fill="#e8effd" stroke="#2563eb" stroke-width="2"/>
<text x="110" y="145" font-size="15" fill="#2563eb" font-weight="bold" text-anchor="middle" font-family="Consolas, Menlo, monospace">nuevo</text>
<rect x="265" y="115" width="150" height="50" rx="25" fill="#e8f6ee" stroke="#1f9d55" stroke-width="2"/>
<text x="340" y="145" font-size="15" fill="#1f9d55" font-weight="bold" text-anchor="middle" font-family="Consolas, Menlo, monospace">listo</text>
<rect x="535" y="115" width="150" height="50" rx="25" fill="#fdf4e3" stroke="#b7791f" stroke-width="2"/>
<text x="610" y="145" font-size="15" fill="#b7791f" font-weight="bold" text-anchor="middle" font-family="Consolas, Menlo, monospace">ejecución</text>
<rect x="805" y="115" width="150" height="50" rx="25" fill="#fdecec" stroke="#c53030" stroke-width="2"/>
<text x="880" y="145" font-size="15" fill="#c53030" font-weight="bold" text-anchor="middle" font-family="Consolas, Menlo, monospace">terminado</text>
